services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    command: start-dev --import-realm --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9093:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      # Mounted read-only; --import-realm imports this on first boot if realm absent.
      # Delete the named volume and restart to re-import after changes.
      - ./keycloak/demo-realm.json:/opt/keycloak/data/import/demo-realm.json:ro
    healthcheck:
      # Keycloak 25+ serves health on management port 9000, not main port 8080.
      # --health-enabled=true is required or the endpoint returns 404.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # Keycloak is slow to start; give it a head start

volumes:
  keycloak_data:  # Named volume keeps realm config across container restarts
